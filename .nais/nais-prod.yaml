apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: tsm-behandler
  namespace: tsm
  labels:
    team: tsm

spec:
  uses:
    postgres:
      - name: tsm-behandler-postgres
  port: 8080
  replicas:
    min: 2
    max: 3
  resources:
    requests:
      cpu: 200m
      memory: 512Mi

  liveness:
    path: /internal/health/alive
  readiness:
    path: /internal/health/ready
  preStopHook:
    http:
      path: /internal/shutdown
  prometheus:
    enabled: true
    path: /internal/metrics
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
  azure:
    application:
      enabled: true
  maskinporten:
    enabled: true
    scopes:
      consumes:
        - name: "nhn:hpr/extended"
  accessPolicy:
    inbound:
      rules:
        - application: syk-inn-api
        - application: syk-inn
        - application: zara
        - application: regulus-maximus
    outbound:
      rules:
        - application: logging
          namespace: nais-system
      external:
        - host: api.offentlig.hpr.nhn.no
  env:
    - name: HPR_EXPORT_ENDPOINT
      value: https://api.offentlig.hpr.nhn.no
