apiVersion: nais.io/v1
kind: Naisjob
metadata:
  name: hpr-import
  namespace: tsm
  labels:
    team: tsm
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  activeDeadlineSeconds: 3600
  uses:
    postgres:
      - name: tsm-behandler-postgres
  backoffLimit: 1
  restartPolicy: Never
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  maskinporten:
    enabled: true
    scopes:
      consumes:
        - name: "nhn:hpr/export"
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
