ktor {
  deployment {
    port = 8080
    shutdownTimeout = 15000
  }
  application {
    modules = [no.nav.tsm.ApplicationKt.module]
  }
}

app {
  name = ${NAIS_POD_NAME}
}

external {
  hprExportEndpoint = ${HPR_EXPORT_ENDPOINT}
}

postgres {
  jdbc = ${DB_JDBC_URL}
  username = ${DB_USERNAME}
  password = ${DB_PASSWORD}
  schema = "public"
}
